name: Angular CI/CD to IIS

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab too

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' # change according to your project
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: node --max_old_space_size=4096 ./node_modules/@angular/cli/bin/ng build --configuration production # change according to your project

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/my-angular-ci-cd/browser   # change according to your project
          retention-days: 2

  deploy:
    needs: build
    runs-on: [self-hosted, Windows]   # this job runs ON your IIS Windows Server
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: C:\deploy\angular-temp
          
      - name: Backup Current Deployment
        run: |
           # Saves current live app before overwriting, so we can roll back if new version fails
           $BackupRoot = "C:\inetpub\wwwroot\myangularapp"   # <-- change to your actual backup path
           $TimeStamp = Get-Date -Format "yyyyMMdd_HHmmss"
           $BackupFolder = Join-Path $BackupRoot $TimeStamp

           New-Item -ItemType Directory -Force -Path $BackupFolder | Out-Null

           if ((Test-Path "C:\inetpub\wwwroot\myangularapp") -and (Get-ChildItem "C:\inetpub\wwwroot\myangularapp" -ErrorAction SilentlyContinue)) {
                Copy-Item "C:\inetpub\wwwroot\myangularapp" $BackupFolder -Recurse -Force
                Write-Host "Backup created at $BackupFolder"
            } else {
                Write-Host "Nothing to back up (first deployment)."
            }

      - name: Stop IIS site
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-WebSite -Name "Default Web Site"   # <-- change to your actual IIS site name

      - name: Clear old files and deploy new build
        shell: powershell
        run: |
          $dest = "C:\inetpub\wwwroot\myangularapp"   # <-- change to your actual site path
          if (Test-Path $dest) {
            Get-ChildItem -Path $dest -Recurse -Force |
              Where-Object { $_.Name -ne "web.config" } |
              Remove-Item -Recurse -Force
          } else {
            New-Item -Path $dest -ItemType Directory
          }
          Copy-Item -Path "C:\deploy\angular-temp\*" -Destination $dest -Recurse -Force -Exclude "web.config"

      - name: Start IIS site
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebSite -Name "Default Web Site"   # <-- change to your actual IIS site name

      - name: Clean up temp folder
        shell: powershell
        run: Remove-Item -Path "C:\deploy\angular-temp" -Recurse -Force -ErrorAction SilentlyContinue
